[project]
name = "rag-golden-serve"
version = "0.1.0"
description = "The rag-golden-eval pipeline as a service that is served, observed and deployed"
requires-python = ">=3.12"
dependencies = [
    "bm25s==0.3.13",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy==2.5.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic==2.14.0",
    "pystemmer==3.1.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/rag-golden-eval", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor", "bench"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

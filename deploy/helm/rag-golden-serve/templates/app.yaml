apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "rag-golden-serve.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rag-golden-serve.selector" (dict "root" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-golden-serve.selector" (dict "root" . "component" "app") | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required: the git commit the image was built from" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | default (printf "http://%s-model:%v/v1" .Release.Name .Values.model.port) | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_TIMEOUT_S
              value: {{ .Values.llm.timeoutSeconds | quote }}
            - name: PROMPT_VERSION
              value: {{ .Values.promptVersion | quote }}
          # /healthz answers once the BM25 index is in memory (built at start-up, about 10 seconds). It does not
          # call the model server, so a dead model server shows up as 502s on /ask, not as a restarting app.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "rag-golden-serve.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "rag-golden-serve.selector" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
